<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in • DAV PS KKP</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head>
<body>
<div class="login">
  <form class="login-card" method="post" autocomplete="on">
    <div class="login-mark">⌂</div>
    <div class="eyebrow">DAV PS KKP</div>
    <h1 style="margin:5px 0 3px">Welcome back</h1>
    <p class="muted" style="margin-top:0">Sign in to the school management system.</p>
    {% if error %}<div class="alert error">{{error}}</div>{% endif %}
    <div class="field"><label>Username</label><input name="username" autocomplete="username" autofocus required></div>
    <div class="field" style="margin-top:12px"><label>Password</label><div style="display:flex;gap:8px;align-items:center"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required style="flex:1"><button type="button" class="password-toggle" aria-label="Show password" title="Show password" onclick="const p=document.getElementById('loginPassword');const on=p.type==='text';p.type=on?'password':'text';this.innerHTML=on?'<svg viewBox=\"0 0 24 24\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>':'<svg viewBox=\"0 0 24 24\"><path d=\"M3 3l18 18\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M2 12s3.5-6 10-6c1.7 0 3.2.4 4.5 1M22 12s-3.5 6-10 6c-1.7 0-3.2-.4-4.5-1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>';this.setAttribute('aria-label',on?'Show password':'Hide password')"> <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div></div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px">Sign in</button>
    <div class="actions" style="justify-content:flex-end;margin-top:10px"><a class="small" href="/announcements">📢 Public announcements</a></div>
    <p class="small muted" style="margin:13px 0 0">First-time accounts must set a new username and password before using the system.</p>
  </form>
</div>
</body></html>
