<!doctype html><html><head><meta charset="utf-8"><title>Restricted Audit</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body><div class="login"><form class="login-card" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><h1>Restricted audit</h1><p class="muted">This page is deliberately not linked from the normal school website.</p>{% if error %}<div class="alert error">{{error}}</div>{% endif %}<div class="field"><label>Audit username</label><input name="username"></div><div class="field" style="margin-top:12px"><label>Audit password</label><div style="display:flex;gap:8px;align-items:center"><input id="auditPassword" name="password" type="password" autocomplete="current-password" style="flex:1"><button type="button" class="password-toggle" aria-label="Show password" title="Show password" onclick="const p=document.getElementById('auditPassword');const on=p.type==='text';p.type=on?'password':'text';this.innerHTML=on?'<svg viewBox=\"0 0 24 24\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>':'<svg viewBox=\"0 0 24 24\"><path d=\"M3 3l18 18\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M2 12s3.5-6 10-6c1.7 0 3.2.4 4.5 1M22 12s-3.5 6-10 6c-1.7 0-3.2-.4-4.5-1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>';this.setAttribute('aria-label',on?'Show password':'Hide password')"> <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div></div><button class="btn btn-primary" style="margin-top:14px;width:100%">Open audit</button></form></div></body></html>
